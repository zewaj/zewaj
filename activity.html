<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 1 ]: إعدادات الصفحة والـ Head ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نشاطات العميل - منصة زواج</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 2 ]: سكربت التهيئة المبكرة (Iframe) ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
    <script>
        const initialParams = new URLSearchParams(window.location.search);
        let isGeminiCanvas = false;
        if (window.self !== window.top) {
            try { let pd = window.parent.document; } catch(e) { isGeminiCanvas = true; }
        }
        
        // إخفاء الشريط الأسود وتبويبات (مفضلاتي/طلباتي) عندما تكون الصفحة داخل الاندكس
        if ((window.self !== window.top && !isGeminiCanvas) || initialParams.get('embedded') === 'true' || initialParams.has('autoPhone') || initialParams.has('phone')) {
            document.documentElement.classList.add('in-iframe');
            document.write('<style>#fallbackLogin { display: none !important; visibility: hidden !important; } #innerTabsContainer { display: none !important; } html, body { background-color: transparent !important; }</style>');
        }
    </script>

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 3 ]: التنسيقات العامة (CSS) ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
        
        .chat-scroll-container { overscroll-behavior-y: contain; scroll-behavior: auto; } /* تم التعديل لنزول فوري */

        html.in-iframe #dashboardContent,
        body.in-iframe #dashboardContent { padding-top: 0.5rem !important; }

        html.in-iframe .unified-sticky-header { background: transparent !important; border: none !important; box-shadow: none !important; }
        html.in-iframe #subTabsWrapper { background: transparent !important; border: none !important; padding-top: 0 !important; }

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 4 ]: التنسيقات الحركية (Animations) ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @keyframes successPulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); border-color: #10b981; }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); border-color: #34d399; }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); border-color: #e2e8f0; }
        }
        .highlight-flash {
            animation: successPulse 2s ease-out 4;
            border-width: 2px !important; border-color: #10b981 !important;
            background-color: #f0fdf4 !important; transition: all 0.5s ease-in-out;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .toast-enter { animation: slideUpFade 0.3s ease-out forwards; }

        .skeleton-shimmer {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="text-slate-800 relative min-h-screen">

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 5 ]: شريط المزامنة الصامت ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
    <div id="syncBanner" class="fixed top-3 left-3 z-[100] bg-white/90 backdrop-blur-sm border border-slate-200 shadow-sm rounded-full px-2.5 py-1.5 transition-opacity duration-300 opacity-0 pointer-events-none flex items-center justify-center gap-1.5">
        <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-indigo-500"></span>
        </span>
        <span class="text-[10px] font-bold text-slate-500">تحديث صامت...</span>
    </div>

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 6 ]: لوحة الاختبار (تختفي في الإنتاج) ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
    <div id="fallbackLogin" class="fixed top-0 left-0 right-0 bg-[#0f172a] text-white z-[200] shadow-xl flex flex-col p-3 gap-3">
        <div class="flex flex-wrap items-center justify-center gap-2 max-w-4xl mx-auto w-full relative">
            
            <div class="ml-auto bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1.5 shrink-0">
                <span class="text-xs font-bold text-slate-400">الرصيد:</span>
                <span id="userPointsDisplay" class="text-sm font-black text-amber-400">0</span>
                <span>💎</span>
            </div>

            <span class="text-xs font-bold text-slate-300 ml-2">لوحة الاختبار:</span>
            <div class="flex" dir="ltr">
                <input type="tel" id="fbPhone" class="w-32 p-2 border border-slate-700 bg-[#1e293b] rounded-l-lg outline-none text-center text-sm font-bold text-white focus:border-indigo-500" placeholder="5XXXXXXXX">
                <span class="p-2 border border-slate-700 border-l-0 bg-slate-700 rounded-r-lg text-sm text-slate-300 font-bold">+966</span>
            </div>
            <input type="text" id="fbRefId" class="w-24 p-2 border border-slate-700 bg-[#1e293b] rounded-lg outline-none text-center text-sm font-bold text-white focus:border-indigo-500" placeholder="رقم الملف">
            <button id="fallbackSubmitBtn" onclick="applyFallbackLogin()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition-colors text-sm flex items-center justify-center gap-1 shadow-md w-24">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                <span>عرض</span>
            </button>
            <button onclick="addCurrentToQuickAccess()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-3 rounded-lg transition-colors text-xs flex items-center gap-1 shadow-md" title="حفظ هذا الحساب للوصول السريع">
                + إضافة
            </button>
        </div>
        <div class="flex items-center justify-center gap-2 max-w-4xl mx-auto w-full overflow-x-auto hide-scroll pb-1">
            <span class="text-[10px] font-bold text-slate-400 shrink-0">دخول سريع:</span>
            <div id="quickAccessButtons" class="flex items-center gap-2"></div>
        </div>
    </div>

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 7 ]: الحاوية الرئيسية والتبويبات العلوية ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
    <div id="dashboardContent" class="w-full max-w-5xl mx-auto transition-all pt-[110px] pb-12">
        <div class="unified-sticky-header sticky top-0 z-40 bg-[#f8fafc] shadow-sm border-b border-slate-200 mt-2">
            <!-- التبويبات الرئيسية -->
            <div id="innerTabsContainer" class="flex w-full overflow-x-auto hide-scroll bg-white">
                <button id="tabBtn-favorites" onclick="switchTab('favorites')" class="flex-1 py-4 px-4 text-sm font-bold text-slate-500 hover:bg-slate-50 transition-all whitespace-nowrap flex items-center justify-center gap-2 border-b-2 border-transparent">
                    <span class="text-amber-500 text-lg">⭐️</span> مفضلاتي
                </button>
                <button id="tabBtn-requests" onclick="switchTab('requests')" class="flex-1 py-4 px-4 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/30 transition-all whitespace-nowrap flex items-center justify-center gap-2 relative">
                    <span class="text-indigo-500 text-lg">💬</span> طلباتي والمحادثات
                </button>
            </div>
            
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 8 ]: أزرار الصادر والوارد ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
            <div id="subTabsWrapper" class="px-4 py-2 bg-slate-50 border-t border-slate-100 hidden">
                <div class="flex items-center justify-between max-w-md mx-auto gap-2">
                    <div class="flex bg-slate-200/60 p-1.5 rounded-xl shadow-inner flex-1">
                        <button id="subTab-incoming" onclick="switchReqTab('incoming')" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all relative flex items-center justify-center gap-1.5">
                            <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                            <span>طلبات واردة</span>
                            <span id="incomingBadge" class="hidden absolute -top-1.5 -left-1.5 bg-slate-400 text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center shadow-sm">0</span>
                        </button>
                        <button id="subTab-outgoing" onclick="switchReqTab('outgoing')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-slate-800 shadow-sm transition-all flex items-center justify-center gap-1.5 border border-slate-200/50 relative">
                            <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                            <span>طلبات أرسلتها</span>
                            <span id="outgoingBadge" class="hidden absolute -top-1.5 -left-1.5 bg-slate-400 text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center shadow-sm">0</span>
                        </button>
                    </div>
                    <button type="button" onclick="manualRefresh()" id="manualRefreshBtn" class="bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 shadow-sm p-2 rounded-xl transition-all relative overflow-hidden" title="تحديث البيانات">
                        <svg class="w-5 h-5 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
            </div>
        </div>

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 9 ]: حاوية المفضلات ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
        <div id="favoritesTabContainer" class="tab-content hidden opacity-0 transition-all duration-500 mt-4 px-4">
            <div id="favoritesList" class="w-full"></div>
        </div>

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 10 ]: حاوية الطلبات (الواردة والصادرة) ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
        <div id="requestsTabContainer" class="tab-content block opacity-100 transition-all duration-500 mt-4 px-4">
            <div id="incomingReqsSection" class="w-full hidden fade-in">
                <div id="incomingRequestsList" class="w-full"></div>
            </div>
            <div id="outgoingReqsSection" class="w-full block fade-in">
                <div id="requestsList" class="w-full"></div>
            </div>
        </div>
    </div>

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 11 ]: نافذة إرسال رسالة / تعديل (Modal) ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
    <div id="replyModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[250] hidden flex items-center justify-center p-4 fade-in">
        <div id="replyModalBox" class="bg-white rounded-2xl p-5 max-w-sm w-full shadow-2xl text-center relative overflow-hidden">
            <div id="replyModalHeaderBg" class="absolute top-0 left-0 right-0 h-16 bg-indigo-50 border-b border-indigo-100 -z-10"></div>
            <button type="button" onclick="closeReplyModal()" class="absolute top-3 left-3 text-slate-400 hover:text-slate-600 transition-colors bg-white rounded-full p-1 shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div id="replyModalIconWrapper" class="w-14 h-14 bg-white text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-3 shadow-md border border-slate-100 relative mt-2">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </div>
            <h3 id="replyModalTitle" class="text-lg font-bold text-slate-800 mb-1">إرسال رسالة</h3>
            <p id="replyModalDesc" class="text-[11px] text-slate-500 mb-4 font-medium">سيتم إرسال هذه الرسالة للطرف الآخر عبر الإدارة.</p>
            
            <textarea id="replyMessage" rows="4" class="w-full p-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 resize-none text-sm mb-4 text-right bg-slate-50" placeholder="اكتب رسالتك هنا..."></textarea>
            
            <div id="quotaWarning" class="hidden mb-4 text-center p-2 rounded-lg bg-rose-50 border border-rose-200 shadow-sm"></div>
            
            <div class="flex gap-2">
                <button id="replySubmitBtn" type="button" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition-all shadow-md active:scale-95 text-sm flex items-center justify-center gap-2">
                    <span>تأكيد الإرسال</span>
                </button>
            </div>
        </div>
    </div>

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 12 ]: نافذة تأكيد الإجراء (Confirm Action Modal) ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
    <div id="confirmActionModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[300] hidden flex items-center justify-center p-4 fade-in">
        <div id="confirmActionBox" class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center relative">
            <div class="w-14 h-14 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-3">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2">تأكيد الإجراء</h3>
            <p id="confirmActionText" class="text-xs text-slate-600 mb-6 leading-relaxed font-medium whitespace-pre-wrap">جاري الحساب...</p>
            <div class="flex gap-2">
                <button type="button" onclick="executeConfirmAction()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition-colors text-sm shadow-md">نعم، متأكد</button>
                <button type="button" onclick="closeConfirmModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl transition-colors text-sm shadow-md">تراجع</button>
            </div>
        </div>
    </div>

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 13 ]: نافذة التنبيهات العامة (Alert Modal) ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
    <div id="msgModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[350] hidden flex items-center justify-center p-4 fade-in">
        <div id="msgModalBox" class="bg-white rounded-2xl p-6 max-w-xs w-full shadow-2xl transform transition-all text-center relative">
            <h3 id="msgModalTitle" class="text-lg font-bold text-slate-800 mb-2">تنبيه</h3>
            <p id="msgModalText" class="text-xs text-slate-600 mb-6 leading-relaxed font-medium whitespace-pre-wrap"></p>
            <button type="button" onclick="closeModal()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl transition-colors text-sm shadow-md">حسناً فهمت</button>
        </div>
    </div>

        function safeGetTime(dateString) {
            if (!dateString) return 0;
            const safeString = String(dateString).replace(/-/g, '/').replace('T', ' '); 
            const parsedDate = new Date(safeString);
            return isNaN(parsedDate) ? 0 : parsedDate.getTime();
        }

        function timeAgo(dateString) {
            if (!dateString) return "منذ فترة";
            const date = new Date(String(dateString).replace(/-/g, '/').replace('T', ' '));
            if (isNaN(date.getTime())) return dateString; 
            const diffInSeconds = Math.floor((new Date() - date) / 1000);
            if (diffInSeconds < 60) return "الآن";
            const diffInMinutes = Math.floor(diffInSeconds / 60);
            if (diffInMinutes < 60) return `منذ ${diffInMinutes} دقيقة`;
            const diffInHours = Math.floor(diffInMinutes / 60);
            if (diffInHours < 24) return `منذ ${diffInHours} ساعة`;
            const diffInDays = Math.floor(diffInHours / 24);
            if (diffInDays === 1) return "أمس";
            if (diffInDays === 2) return "منذ يومين";
            if (diffInDays <= 10) return `منذ ${diffInDays} أيام`;
            return `منذ ${diffInDays} يوم`;
        }

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->

        function showToast(text) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastText').innerText = text;
            toast.classList.remove('hidden');
            toast.classList.add('toast-enter');
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('hidden');
            }, 3000);
        }

        function setupHeightObserver() {
            if (window.self !== window.top) {
                const container = document.getElementById('dashboardContent');
                if (!container) return;
                const resizeObserver = new ResizeObserver(entries => {
                    for (let entry of entries) {
                        const newHeight = entry.target.scrollHeight + 80;
                        window.parent.postMessage({ type: 'resizeActivityIframe', height: newHeight }, '*');
                    }
                });
                resizeObserver.observe(container);
            }
        }

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 18 ]: معالجة نصوص المحادثة وبناء البطاقات ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
        function parseChatThread(displayChunks, originalChunks, role, isPendingAdmin) {
            if (!displayChunks || displayChunks.length === 0) return '<p class="text-xs text-slate-400 font-bold text-center py-4">لا توجد محادثة.</p>';
            let html = '<div class="flex flex-col gap-1.5 w-full">';
            
            let hasHiddenNextMessage = false;
            if (originalChunks.length > displayChunks.length) {
                let hiddenMsg = originalChunks[displayChunks.length];
                let isHiddenFromOther = (role === 'firstParty' && (hiddenMsg.includes('[من الطرف الثاني]') || hiddenMsg.includes('[من المطلوب]'))) ||
                                        (role === 'secondParty' && (hiddenMsg.includes('[من الطرف الأول]') || hiddenMsg.includes('[من الطالب]')));
                if (isHiddenFromOther) hasHiddenNextMessage = true;
            }

            displayChunks.forEach((chunk, index) => {
                let isPureAdmin = chunk.includes('[من الإدارة]'); 
                let isFromFirst = chunk.includes('[من الطرف الأول]') || chunk.includes('[من الطالب]');
                let isFromSecond = chunk.includes('[من الطرف الثاني]') || chunk.includes('[من المطلوب]');
                
                let isMe = (role === 'firstParty' && isFromFirst) || (role === 'secondParty' && isFromSecond);
                let isAdmin = isPureAdmin;
                let cleanText = chunk.replace(/\[.*?\]:?/g, '').trim();
                
                let bg = isMe ? 'bg-[#dcf8c6]' : (isAdmin ? 'bg-indigo-50 border-indigo-200 border' : 'bg-white border-slate-200 border');
                
                let align = isMe ? 'self-start' : 'self-end'; 
                let radius = isMe ? 'rounded-2xl rounded-tr-sm' : 'rounded-2xl rounded-tl-sm';
                if (isAdmin) radius = 'rounded-xl';
                let labelColor = isMe ? 'text-emerald-700' : (isAdmin ? 'text-indigo-600' : 'text-indigo-600');
                let label = isMe ? 'أنا' : (isAdmin ? 'الإدارة' : 'الطرف الآخر');
                
                let isLastChunk = index === displayChunks.length - 1;
                let tickIcon = '';
                
                if (isMe) {
                    if (isLastChunk) {
                        if (hasHiddenNextMessage) {
                            tickIcon = `<svg class="w-3.5 h-3.5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7M5 19l4 4L19 13"></path></svg>`; 
                        } else if (isPendingAdmin) {
                            tickIcon = `<svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`; 
                        } else {
                            tickIcon = `<svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`; 
                        }
                    } else {
                        tickIcon = `<svg class="w-3.5 h-3.5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7M5 19l4 4L19 13"></path></svg>`; 
                    }
                }

                html += `
                <div class="${align} min-w-[140px] max-w-[85%] ${bg} p-2 ${radius} relative shadow-sm flex flex-col gap-1 text-right">
                    <div class="flex items-center justify-between gap-2 mb-0.5">
                        <span class="text-[9px] font-black ${labelColor}">${label}</span>
                    </div>
                    <p class="text-xs text-slate-800 whitespace-pre-wrap leading-relaxed">${cleanText}</p>
                    ${isMe ? `<div class="self-end mt-1 flex items-center justify-end">${tickIcon}</div>` : ''}
                </div>`;
            });
            return html + '</div>';
        }

// ✂️ ---------- [ القسم رقم 19 ]: رسم قوائم المفضلات والطلبات الصادرة ---------- ✂️
// 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥
        window.myFavsDataStore = {};

        // دالة مساعدة لجلب حالة ملف العميل بأمان
        function getMyProfileStatus() {
            try {
                let rawUser = localStorage.getItem('currentUser');
                let currentUserData = (rawUser && rawUser !== 'undefined') ? JSON.parse(rawUser) : {};
                return localStorage.getItem('profileStatus') || currentUserData.status || currentUserData.profileStatus || 'نشط';

        function renderOutgoingRequests(reqs) {
            const container = document.getElementById('requestsList');
            window.myReqsDataStore = {}; 
            let outBadge = 0;
            window.latestOutgoingTime = 0;

            if(!reqs || reqs.length === 0) {
                container.innerHTML = `<div class="text-center text-sm text-slate-400 py-16 pb-24 font-bold bg-white rounded-2xl border border-dashed border-slate-200 shadow-sm">لم تقم بإرسال أي طلبات.</div>`;
                updateBadge('outgoingBadge', 0, false);
                return;
            }
            reqs.sort((a, b) => safeGetTime(b.lastActionDate || b.date) - safeGetTime(a.lastActionDate || a.date));
            if(reqs.length > 0) window.latestOutgoingTime = safeGetTime(reqs[0].lastActionDate || reqs[0].date);

            let hasRedBadge = false;
            let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full items-start">';
            
            let config = {}; try { config = JSON.parse(localStorage.getItem('platform_config')) || {}; } catch(e){}
            const MAX_INITIAL = config.MAX_INITIAL_MESSAGES !== undefined ? config.MAX_INITIAL_MESSAGES : 10;
            const MAX_EXT = config.MAX_EXTENDED_MESSAGES !== undefined ? config.MAX_EXTENDED_MESSAGES : 5;
            const EXT_COST_REG = config.EXTEND_COST_REGULAR !== undefined ? config.EXTEND_COST_REGULAR : 2;
            const EXT_COST_SPEC = config.EXTEND_COST_SPECIAL_WOMEN !== undefined ? config.EXTEND_COST_SPECIAL_WOMEN : 10;

            const myProfileStatus = getMyProfileStatus();
            const isBannedFromChat = (myProfileStatus === 'محذوف' || myProfileStatus === 'تم الزواج');
            const isNewOrWaiting = (myProfileStatus === 'جديد' || myProfileStatus === 'انتظار');

            reqs.forEach(req => {
                let statusText = req.status || 'جاري المعالجة';
                let uiStatusText = statusText.replace('الطرف الأول', 'ردك').replace('الطرف الثاني', 'الطرف الآخر');
                let targetInfo = req.unifiedName || req.targetData || req.targetSummary || (req.targetRefId ? 'ملف #' + req.targetRefId : 'طلب تواصل');
                window.myReqsDataStore[req.targetRefId] = req; 
                
                let isAccepted = statusText.includes('قبول') || statusText.includes('مقبول');
                let isRejected = statusText.includes('رفض') || statusText.includes('مرفوض') || statusText.includes('ملغى');
                let isPendingAdmin = statusText.includes('اعتماد');
                
                let isQueued = statusText.includes('قائمة الانتظار'); 

                if(!isAccepted && !isRejected && !isQueued) {
                    outBadge++;
                    if(statusText.includes('ردك')) hasRedBadge = true;
                }

                let statusColor = isAccepted ? 'text-emerald-600 bg-emerald-50 border-emerald-200' : 
                                 (isRejected ? 'text-rose-600 bg-rose-50 border-rose-200' : 
                                 (isQueued ? 'text-purple-600 bg-purple-50 border-purple-200' : 
                                 (statusText.includes('ردك') ? 'text-amber-600 bg-amber-50 border-amber-200 animate-pulse' :

            window.tempDirectContactReqId = reqId;

            const FEE_NORMAL = config.DIRECT_CONTACT_FEE !== undefined ? config.DIRECT_CONTACT_FEE : 150;
            const FEE_SPECIAL_WOMAN = config.DIRECT_FEE_SPECIAL_WOMEN !== undefined ? config.DIRECT_FEE_SPECIAL_WOMEN : 250;
            const FEE_SPECIAL_MAN = config.DIRECT_FEE_MEN_SPECIAL !== undefined ? config.DIRECT_FEE_MEN_SPECIAL : 0;

            const isTargetSpecial = (targetMarriageType || '').includes('ظروف') || (targetMarriageType || '').includes('خاص');
            
            let finalFee = FEE_NORMAL;
            if (isMyTypeSpecial) {
                finalFee = FEE_SPECIAL_MAN;
            } else if (isTargetSpecial) {
                finalFee = FEE_SPECIAL_WOMAN;
            }

            const textEl = document.getElementById('confirmActionText');
            // التعديل: إبراز الرسوم لتكون واضحة وتنبض بالأحمر

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
        async function fetchWithRetry(url, options, maxRetries = 2) {
            for (let i = 0; i <= maxRetries; i++) {
                const controller = new AbortController(); 
                const timeoutId = setTimeout(() => controller.abort(), 45000); // 45 ثانية لتجنب الخطأ الوهمي
                options.signal = controller.signal;
                try { 
                    const res = await fetch(url, options); 
                    clearTimeout(timeoutId); 
                    return await res.text(); 
                } catch (e) { 
                    clearTimeout(timeoutId); 
                    if (i === maxRetries) throw e; 
                    await new Promise(r => setTimeout(r, 1500)); 
                }
            }
        }

window.isSubmittingAction = false;

async function submitReply() {
    if (window.isSubmittingAction) return; 
    
    const replyText = document.getElementById('replyText').value.trim();
    if (!replyText) { alert("الرجاء كتابة رسالة."); return; }

    window.isSubmittingAction = true;
    
    try {
        const payload = {
            action: currentReplyType === 'طلب تواصل مباشر' ? 'requestDirectContact' : 'replyToRequest',
            phone: phoneParam,
            reqId: currentReplyReqId,
            requesterRefId: requesterRefIdParam,
            replyType: currentReplyType === 'طلب تواصل مباشر' ? 'طلب تواصل مباشر' : (currentReplyType === 'مقبول' ? 'مقبول' : 'اعتذار'),
            replyMessage: replyText
        };

        const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        
        const result = await res.json();
        
        if (!result.success) {
            let backendMsg = result.message || result.error || 'تم رفض العملية من قبل السيرفر.';
            alert('⚠️ تنبيه من النظام:\n\n' + backendMsg);
            return;
        }

        if (currentReplyType === 'طلب تواصل مباشر' && result.feeMessage) {
            alert('✅ نجاح:\n\n' + result.feeMessage);
        }

        closeReplyModal();
        await manualRefresh();
        
    } catch (err) {
        alert("حدث خطأ في الاتصال، يرجى المحاولة لاحقاً.");
    } finally {
        window.isSubmittingAction = false; 
    }
}

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
        function loadFromCentralCache(isSilent = true, directData = null) {
            try {
                let cacheStr = directData ? JSON.stringify(directData) : localStorage.getItem('master_activity_cache');
                if (cacheStr) {
                    const result = directData ? directData : JSON.parse(cacheStr);
                    
                    if (result && result.currentUserMarriageType !== undefined) {
                        localStorage.setItem('verified_user_mType', result.currentUserMarriageType);
                    }
                    
                    window.userPointsBalance = result.walletBalance || result.balance || 0;
                    const pointsDisplay = document.getElementById('userPointsDisplay');
                    if (pointsDisplay) {
                        pointsDisplay.innerText = window.userPointsBalance;
                    }
                    
                    renderMyFavorites(result.favorites || []); 
                    renderOutgoingRequests(result.outgoingRequests || []); 
                    renderIncomingRequests(result.incomingRequests || []);
                    
                    scrollToBottomChats(); // إجبار النزول لأسفل المحادثة فوراً
                    
                    let hasIn = result.incomingRequests && result.incomingRequests.length > 0; let hasOut = result.outgoingRequests && result.outgoingRequests.length > 0;
                    
                    if (tabParam === 'requests' && !isSilent) {
                        if (hasIn && !hasOut) switchReqTab('incoming'); 
                        else if (hasOut && !hasIn) switchReqTab('outgoing');
                        else if (hasIn && hasOut) { if (window.latestIncomingTime > window.latestOutgoingTime) switchReqTab('incoming'); else switchReqTab('outgoing'); }
                    }

                    if (window.highlightedReqId) {
                        setTimeout(() => {
                            const card = document.getElementById(`card-${window.highlightedReqId}`);
                            if (card) { 
                                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                card.classList.add('highlight-flash'); 
                                setTimeout(() => card.classList.remove('highlight-flash'), 4000); 
                            }
                            window.highlightedReqId = null;
                        }, 200); 
                    }
                    const banner = document.getElementById('syncBanner'); if(banner) banner.classList.replace('opacity-100', 'opacity-0');
                } else { 
                    // إذا كان الكاش فارغاً، اطبع الهيكل واضرب السيرفر فوراً باستقلالية تامة
                    if(!isSilent) {
                        showSkeletonLoader();
                        fetchData(false);
                    }
                }
            } catch(e) { 
                if(!isSilent) { showSkeletonLoader(); fetchData(false); } 
            }
        }

        async function fetchData(isSilent = false) {
            if (!phoneParam || !refIdParam || isFetching) return;
            isFetching = true; const banner = document.getElementById('syncBanner');
            if (isSilent && banner) banner.classList.replace('opacity-0', 'opacity-100');
            try {
                const textResult = await fetchWithRetry(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "syncUserActivity", phone: phoneParam, requesterRefId: refIdParam }) });
                const result = JSON.parse(textResult);
                if (result.success) { 
                    if (result.currentUserMarriageType !== undefined) {
                        localStorage.setItem('verified_user_mType', result.currentUserMarriageType);
                    }
                    localStorage.setItem('master_activity_cache', textResult); 
                    loadFromCentralCache(isSilent, result); 
                } 
                else showErrorState("خطأ في جلب البيانات من السيرفر.");
            } catch (e) { 
                if(!isSilent) showErrorState("تفاصيل الخطأ: " + e.message); 
            } 
            finally { 
                isFetching = false; 
                setTimeout(() => { 
                    if(banner) banner.classList.replace('opacity-100', 'opacity-0'); 
                    const btn = document.getElementById('manualRefreshBtn'); 
                    if (btn) { 
                        btn.classList.remove('bg-indigo-50', 'text-indigo-600', 'border-indigo-200'); 
                        btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200'); 
                        const svg = btn.querySelector('svg'); if(svg) svg.classList.remove('animate-spin'); 
                    } 
                }, 500); 
            }
        }

            const urlParams = new URLSearchParams(window.location.search);
            phoneParam = urlParams.get('autoPhone') || urlParams.get('phone') || localStorage.getItem('verified_user_phone') || "";
            refIdParam = urlParams.get('autoRefId') || urlParams.get('refId') || localStorage.getItem('active_profile_refid') || "";
            tabParam = urlParams.get('tab') || 'requests'; window.userStatusParam = urlParams.get('status') || '';
            
            setupHeightObserver(); 
            renderQuickAccessButtons();
            
            if (phoneParam) { let cp = phoneParam.replace('+966', ''); document.getElementById('fbPhone').value = cp.startsWith('0') ? cp.substring(1) : cp; }
            if (refIdParam) { document.getElementById('fbRefId').value = refIdParam; }

            if (!phoneParam || !refIdParam) {
                switchTab('requests'); 
            } else { 
                switchTab(tabParam);
                let cacheStr = localStorage.getItem('master_activity_cache');
                if (!cacheStr) {
                    showSkeletonLoader();
                    fetchData(false); // استقلالية فورية
                } else {
                    loadFromCentralCache(false);
                    if (window.self === window.top) fetchData(true);
                }
            }
            
            window.addEventListener('message', function(event) {
                if (event.data) {
                    if (event.data.action === 'favoriteSuccess') { window.lastFetchTime = 0; if (window.self !== window.top) window.parent.postMessage({ action: 'forceGlobalSync' }, '*'); else fetchData(true); } 
                    else if (event.data.action === 'reRenderFromCache') { loadFromCentralCache(true, event.data.data); }
                    else if (event.data.action === 'forceCacheBypass') {
                        localStorage.removeItem('master_activity_cache');
                        showSkeletonLoader();
                        fetchData(false);
                    }
                }
            });

            window.addEventListener('storage', function(e) {
                if (e.key === 'master_activity_cache') {
                    loadFromCentralCache(true);
                }
            });
            
            // التحديث الذكي: ينبض كل 250 ثانية لإنعاش البيانات بذكاء وبدون إرهاق السيرفر
            setInterval(() => {
                if (!isFetching && document.visibilityState === 'visible') {
                     fetchData(true);
                }
            }, 250000); 
    
        };

            const outBtn = document.getElementById('subTab-outgoing'); const inBtn = document.getElementById('subTab-incoming');

            if (type === 'outgoing') {
                outBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-slate-800 shadow-sm transition-all flex items-center justify-center gap-1.5 border border-slate-200/50 relative";
                inBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all relative flex items-center justify-center gap-1.5";
                outSec.classList.remove('hidden'); inSec.classList.add('hidden');

                inBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-slate-800 shadow-sm transition-all flex items-center justify-center gap-1.5 border border-slate-200/50 relative";
                outBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all flex items-center justify-center gap-1.5 relative";
                inSec.classList.remove('hidden'); outSec.classList.add('hidden');
            }
            scrollToBottomChats(); 
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => { el.classList.add('hidden', 'opacity-0'); el.classList.remove('block', 'opacity-100'); });
            ['favorites', 'requests'].forEach(btn => { const el = document.getElementById(`tabBtn-${btn}`); if(el) el.className = 'flex-1 py-4 px-4 text-sm font-bold text-slate-500 hover:bg-slate-50 transition-all whitespace-nowrap flex items-center justify-center gap-2 border-b-2 border-transparent'; });
            const activeBtn = document.getElementById(`tabBtn-${tabName}`);
            if(activeBtn) {
                activeBtn.className = 'flex-1 py-4 px-4 text-sm font-bold bg-white flex items-center justify-center gap-2 relative';
                if(tabName === 'favorites') activeBtn.className += ' text-amber-600 border-b-2 border-amber-500 bg-amber-50/30';
                if(tabName === 'requests') activeBtn.className += ' text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/30';
            }
            const subTabsWrapper = document.getElementById('subTabsWrapper'); 
            if (tabName === 'requests') { subTabsWrapper.classList.remove('hidden'); scrollToBottomChats(); } else { subTabsWrapper.classList.add('hidden'); }
            let targetContainer = document.getElementById(tabName + 'TabContainer'); if (targetContainer) { targetContainer.classList.remove('hidden'); setTimeout(() => { targetContainer.classList.remove('opacity-0'); targetContainer.classList.add('block', 'opacity-100'); scrollToBottomChats(); }, 50); }
        }

        function manualRefresh() {
            if (isFetching) return; const btn = document.getElementById('manualRefreshBtn');
            if(btn) { btn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200'); btn.classList.add('bg-indigo-50', 'text-indigo-600', 'border-indigo-200'); const svg = btn.querySelector('svg'); if(svg) svg.classList.add('animate-spin'); }
            
            localStorage.removeItem('master_activity_cache');
            
            fetchData(false).finally(() => {
                if (window.self !== window.top) window.parent.postMessage({ action: 'forceGlobalSync' }, '*'); 
            });
        }

        function showErrorState(errorMsg) {
            const errorHtml = `<div class="text-center text-sm text-rose-500 py-16 pb-24 font-bold w-full bg-rose-50 rounded-2xl border border-rose-100 shadow-sm">${errorMsg}</div>`;
            document.getElementById('favoritesList').innerHTML = errorHtml; document.getElementById('requestsList').innerHTML = errorHtml; document.getElementById('incomingRequestsList').innerHTML = errorHtml;
        }

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 27 ]: لوحة الوصول السريع (Testing) ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
        function renderQuickAccessButtons() {
            let saved = []; try { saved = JSON.parse(localStorage.getItem('quick_access_accounts')) || []; } catch(e){}
            let allAccounts = [...defaultQuickAccess]; saved.forEach(s => { if(!allAccounts.some(a => a.phone === s.phone && a.refId === s.refId)) allAccounts.push(s); });
            const container = document.getElementById('quickAccessButtons'); container.innerHTML = '';
            allAccounts.forEach(acc => { container.innerHTML += `<button type="button" onclick="useQuickAccess('${acc.phone}', '${acc.refId}')" class="bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600 font-bold py-1 px-3 rounded-md transition-colors text-[10px] shadow-sm">ملف #${acc.refId}</button>`; });
        }

        function addCurrentToQuickAccess() {
            let p = document.getElementById('fbPhone').value.trim(); let r = document.getElementById('fbRefId').value.trim();
            if (!p || !r) { showMsgModal("تنبيه", "يرجى كتابة الجوال ورقم الملف أولاً."); return; }
            let saved = []; try { saved = JSON.parse(localStorage.getItem('quick_access_accounts')) || []; } catch(e){}
            if(!saved.some(a => a.phone === p && a.refId === r)) { saved.push({ phone: p, refId: r }); localStorage.setItem('quick_access_accounts', JSON.stringify(saved)); renderQuickAccessButtons(); showMsgModal("نجاح", "تمت الإضافة بنجاح!"); }
        }

        function useQuickAccess(phone, refId) {
            let cleanPhone = phone.startsWith('0') ? phone.substring(1) : phone; if(cleanPhone.startsWith('966')) cleanPhone = cleanPhone.substring(3);
            document.getElementById('fbPhone').value = cleanPhone; document.getElementById('fbRefId').value = refId; applyFallbackLogin();
        }

        function applyFallbackLogin() {
            let p = document.getElementById('fbPhone').value.trim(); let r = document.getElementById('fbRefId').value.trim();
            if (!p || !r) { showMsgModal("تنبيه", "يرجى إدخال الجوال ورقم الملف."); return; }
            let cleanPhone = p.startsWith('0') ? p.substring(1) : p; if(!cleanPhone.startsWith('+')) cleanPhone = '+966' + cleanPhone;
            phoneParam = cleanPhone; refIdParam = r; localStorage.setItem('verified_user_phone', cleanPhone); localStorage.setItem('active_profile_refid', r);
            const btn = document.getElementById('fallbackSubmitBtn'); const ogHtml = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = spinnerSvg + '<span>جاري...</span>'; btn.classList.add('opacity-75', 'cursor-not-allowed');
            localStorage.removeItem('master_activity_cache');
            fetchData(false).finally(() => { btn.innerHTML = ogHtml; btn.disabled = false; btn.classList.remove('opacity-75', 'cursor-not-allowed'); });
        }
    </script>
</body>
