<!-- ✂️ ---------- [ القسم رقم 1 ]: إعدادات الصفحة والـ Head ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الباقات والاشتراك - منصة زواج</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 2 ]: التنسيقات العامة (CSS) ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn .3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        // داخل الـ iframe تكون الخلفية شفافة لتنسجم مع القشرة (index.html)
        if (window.self !== window.top || new URLSearchParams(window.location.search).get('embedded') === 'true') {
            document.write('<style>html, body { background-color: transparent !important; }</style>');
        }
    </script>
</head>

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 3 ]: هيكل الصفحة (HTML) ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<body class="text-slate-800 antialiased">
    <div class="max-w-2xl mx-auto px-3 pt-4 pb-24">

        <div id="pageTitleBox" class="text-center mb-4">
            <h1 class="text-xl font-black text-slate-800">💎 الباقات والاشتراك</h1>
            <p class="text-[11px] text-slate-500 font-bold mt-1">تُضاف نقاط الباقة فوق رصيدك الحالي ولا تستبدله.</p>
        </div>

        <div id="reasonBox"></div>
        <div id="guestBox"></div>
        <div id="statusBox"></div>
        <div id="pendingBox"></div>
        <div id="referralBox"></div>
        <div id="packagesList" class="flex flex-col gap-3"></div>
        <div id="infoBox"></div>
    </div>

    <!-- نافذة التأكيد -->
    <div id="confirmModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl p-5 fade-in">
            <h3 id="confirmTitle" class="text-base font-black text-slate-800 text-center mb-2"></h3>
            <p id="confirmText" class="text-xs text-slate-600 font-bold leading-relaxed text-center mb-4"></p>
            <div class="flex gap-2">
                <button type="button" onclick="closeConfirm()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm">إلغاء</button>
                <button type="button" id="confirmBtn" class="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm shadow-md">نعم، اشترك</button>
            </div>
        </div>
    </div>

    <!-- نافذة النجاح -->
    <div id="doneModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl p-5 fade-in text-center">
            <div class="text-4xl mb-2">✅</div>
            <h3 class="text-base font-black text-slate-800 mb-2">تم تسجيل طلبك</h3>
            <p id="doneText" class="text-xs text-slate-600 font-bold leading-relaxed mb-4"></p>
            <a id="doneReceiptLink" href="#" target="_blank" rel="noopener" class="block w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm shadow-md mb-2">أرسل الإيصال للوسيط عبر واتساب</a>
            <button type="button" onclick="closeDone()" class="w-full py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm">إغلاق</button>
        </div>
    </div>

    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-xl max-w-[90%] text-center"></div>

<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
<!-- ✂️ ---------- [ القسم رقم 4 ]: جافاسكريبت - الإعدادات والاتصال بالخادم ---------- ✂️ -->
<!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqGgVJ4P0G7mhDtyAMVS4GsQ5BvXlytmhoCon-H_EUdx1KhDBOxr5cyLNR3VcB8sGb/exec";
        // 🛡️ [2026-11-21] بطاقة الجلسة (المرحلة 2): تُمرَّر تلقائياً مع كل طلب للخادم، وتُحفظ من أي رد يحمل authToken (رمز التحقق، الرابط السحري).
        // رد authRequired (بطاقة مفقودة/منتهية والخادم في وضع الرفض) يُخرج العميل لصفحة الدخول مرة واحدة. localStorage مشترك بين القشرة والـ iframe (نفس الأصل).
        // تعديل الإدارة (register.html?mode=admin_edit) يضع window.__adminEditToken فيُرسل توكن الإدارة بدل بطاقة العميل.
        (function(){ if (window.__authPatch) return; window.__authPatch = 1; var _f = window.fetch;
          function onAuthRequired(msg){ if (window.__authExpired || window.__adminEditToken) return; window.__authExpired = 1;
            try { if (window.self !== window.top) { window.parent.postMessage({ action: 'authRequired', message: msg || '' }, window.location.origin); return; } } catch(e){}
            if (typeof window.__handleAuthRequired === 'function') { window.__handleAuthRequired(msg); return; }
            try { localStorage.removeItem('auth_session_token'); localStorage.removeItem('verified_user_phone'); } catch(e){}
            try { alert(msg || 'انتهت جلستك، يرجى تسجيل الدخول من جديد.'); } catch(e){} location.href = 'index.html'; }
          window.fetch = function(u, o){ var isGas = false; try { if (o && typeof o.body === 'string' && typeof u === 'string' && u.indexOf('script.google.com') !== -1) { isGas = true;
            var b = JSON.parse(o.body), changed = false;
            if (b && b.action && !b.authToken && !b.adminToken) { if (window.__adminEditToken) { b.adminToken = window.__adminEditToken; changed = true; } else { var t = localStorage.getItem('auth_session_token'); if (t) { b.authToken = t; changed = true; } } }
            if (changed) o = Object.assign({}, o, { body: JSON.stringify(b) }); } } catch(e){}
            var p = _f.call(this, u, o); if (!isGas || !p || typeof p.then !== 'function') return p;
            return p.then(function(r){ try { r.clone().text().then(function(s){ if (!s || s.indexOf('"auth') === -1) return; var j = JSON.parse(s);
              if (j && typeof j.authToken === 'string' && /^u[12]\./.test(j.authToken)) localStorage.setItem('auth_session_token', j.authToken);
              if (j && j.authRequired) onAuthRequired(j.message); }).catch(function(){}); } catch(e){} return r; }); }; })();

        const urlParams = new URLSearchParams(window.location.search);
        function safeStorage(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }
        const phoneParam = (urlParams.get('phone') || safeStorage('verified_user_phone')).replace(/[^0-9]/g, '');
        const refIdParam = (urlParams.get('refId') || safeStorage('active_profile_refid') || '').toString().trim();

        // زائر غير مسجّل (أو لم يكمل ملفه): يتصفح الباقات فقط ويختار باقات الرجال أو النساء، والاشتراك يتطلب دخولاً
        const isGuest = !phoneParam || !refIdParam || refIdParam === 'null';
        let guestGender = '';

        // وضع النافذة المنبثقة (تفتحها القشرة index.html): العنوان في رأس النافذة فنخفيه هنا، ويصلنا سبب الفتح
        const isModalMode = urlParams.get('modal') === '1';
        const openReason = urlParams.get('reason') || '';
        const needPoints = parseInt(urlParams.get('need')) || 0;

        let pageData = null;
        let selectedPackageId = null;
        let isSubmitting = false;

        function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

        async function postJson(payload) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 30000);
            try {
                const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), signal: controller.signal });
                return JSON.parse(await res.text());
            } finally { clearTimeout(timeoutId); }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3500);
        }

// 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥
// ✂️ ---------- [ القسم رقم 5 ]: جافاسكريبت - رسم الصفحة ---------- ✂️
// 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥

        // 🟢 [2026-11-14] نسخة الصفحة المحفوظة على الجهاز (مفتاحها بالملف أو بجنس الزائر). تكتبها هذه الصفحة بعد كل جلب ناجح،
        // وتكتبها القشرة index.html بالتحميل المسبق بعد المزامنة (prefetchPackagesCache) فتكون جاهزة قبل أن يضغط العميل شارة 💎.
        const PKG_CACHE_VER = 1, PKG_CACHE_MAX_AGE = 7 * 24 * 3600 * 1000;
        function pkgCacheKey() { return isGuest ? ('pkg_page_guest_' + (guestGender === 'أنثى' ? 'f' : 'm')) : ('pkg_page_' + refIdParam); }
        function readPkgCache() {
            try {
                const o = JSON.parse(localStorage.getItem(pkgCacheKey()) || 'null');
                if (!o || o.v !== PKG_CACHE_VER || !o.data || o.data.success !== true || Date.now() - (o.at || 0) > PKG_CACHE_MAX_AGE) return null;
                if (!isGuest && o.data.guest) return null;
                return o.data;
            } catch (e) { return null; }
        }
        function writePkgCache(data) { try { localStorage.setItem(pkgCacheKey(), JSON.stringify({ v: PKG_CACHE_VER, at: Date.now(), data: data })); } catch (e) {} }
        let unconfirmedPrices = false; // true ما دام المعروض نسخة محفوظة لم يؤكدها الخادم بعد
        function setRefreshNote(state) {
            let n = document.getElementById('refreshNote');
            if (!n) {
                n = document.createElement('div'); n.id = 'refreshNote';
                n.className = 'text-center text-[10px] font-bold rounded-lg py-1 mb-2';
                const first = document.getElementById('reasonBox'); first.parentNode.insertBefore(n, first);
            }
            if (!state) { n.classList.add('hidden'); return; }
            n.classList.remove('hidden');
            n.className = 'text-center text-[10px] font-bold rounded-lg py-1 mb-2 ' + (state === 'failed' ? 'bg-amber-50 text-amber-700' : 'bg-slate-100 text-slate-500');
            n.innerHTML = state === 'failed' ? 'تعذر التأكد من آخر الأسعار الآن، وسيؤكد لك الوسيط المبلغ عبر الواتساب' : '<span class="inline-block spin">⏳</span> نتأكد من آخر الأسعار…';
        }

        function receiptLink(name, price, reqId) {
            const text = `السلام عليكم، تم السداد لـ ${name} (${price} ريال) - رقم الطلب ${reqId} - ملف #${refIdParam}. المرفق الإيصال.`;
            return `https://wa.me/${(pageData && pageData.mediatorPhone) || '966590779236'}?text=${encodeURIComponent(text)}`;
        }

        // مدة الإعلان بصيغة عربية سليمة: شهر واحد، شهران، 3-10 أشهر، وما فوق شهراً
        function monthsText(n) {
            n = parseInt(n) || 0;
            if (n === 1) return 'شهر واحد';
            if (n === 2) return 'شهرين';
            if (n >= 3 && n <= 10) return n + ' أشهر';
            return n + ' شهراً';
        }

        // عدد أرقام التواصل بصياغة عربية سليمة: رقم تواصل واحد، رقمان للتواصل، 3-10 أرقام للتواصل
        function extNums(n) {
            n = parseInt(n) || 0;
            return n === 1 ? 'رقم تواصل واحد' : (n === 2 ? 'رقمان للتواصل' : n + ' أرقام للتواصل');
        }

        function renderGuestBox() {
            const box = document.getElementById('guestBox');
            if (!isGuest) { box.innerHTML = ''; return; }
            const btn = (g, label, icon) => `<button type="button" onclick="chooseGuestGender('${g}')" class="flex-1 py-3 rounded-xl font-black text-sm border-2 transition-all ${guestGender === g ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white text-slate-600 border-slate-200 hover:border-indigo-300'}">${icon} ${label}</button>`;
            box.innerHTML = `
                <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-3 mb-3">
                    <p class="text-[11px] font-black text-indigo-800 text-center mb-2">أنت تتصفح كزائر، اختر نوع الباقات التي تريد الاطلاع عليها</p>
                    <div class="flex gap-2">${btn('ذكر', 'باقات الرجال', '👨')}${btn('أنثى', 'باقات النساء', '👩')}</div>
                </div>`;
        }

        function chooseGuestGender(g) { guestGender = g; loadPage(); }

        // الزائر يضغط "اشترك": نطلب منه الدخول أو التسجيل أولاً
        function guestSubscribe() {
            showToast('سجّل دخولك أو أنشئ حسابك مجاناً أولاً لتتمكن من الاشتراك.');
            if (window.self !== window.top) window.parent.postMessage({ action: 'requireLogin' }, '*');
            else setTimeout(() => { window.location.href = 'register.html'; }, 1200);
        }

        // سبب الفتح: عند نقص الرصيد نشرح للعميل لماذا يرى الباقات وماذا سيحدث بعد الاشتراك
        function renderReason() {
            const box = document.getElementById('reasonBox');
            if (isModalMode) document.getElementById('pageTitleBox').classList.add('hidden');
            // حساب موقوف: نشرح له شرط إعادة التفعيل (الباقة المطلوبة تُبرَز في القائمة أدناه)
            const ban = pageData && pageData.ban;
            if (ban) {
                box.innerHTML = `
                <div class="bg-rose-50 border border-rose-200 rounded-2xl p-3 mb-3 text-center">
                    <p class="text-xs font-black text-rose-700">🚫 حسابكم موقوف لعدم الالتزام بشروط المنصة والتعهد.</p>
                    <p class="text-[11px] font-bold text-rose-600 mt-1">لإعادة تفعيله يلزم: ${esc(ban.condText)}${ban.condType === 'package' ? '<br>اشترك في الباقة المطلوبة أدناه (أو باقة أعلى منها) ويُعاد تفعيل حسابكم فور تأكيد السداد.' : '<br>تواصلوا مع الوسيط لإتمام المطلوب.'}</p>
                </div>`;
                return;
            }
            // [2026-11-14] جاء من تنبيه الرصيد المنخفض في القشرة: نذكّره برصيده ونهوّن عليه الخطوات
            if (openReason === 'lowbalance' && !isGuest) {
                const lb = pageData && pageData.wallet ? (pageData.wallet.balance || 0) : (parseInt(safeStorage('cached_wallet_balance')) || 0);
                box.innerHTML = `
                <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 mb-3 text-center">
                    <p class="text-xs font-black text-amber-800">رصيدك الحالي ${esc(lb)} نقطة فقط 💎</p>
                    <p class="text-[11px] font-bold text-amber-700 mt-1">يمكنك الحصول على نقاط مجاناً بدعوة من تعرف (البطاقة الخضراء أدناه)، أو اختيار باقة تُضاف نقاطها فوق رصيدك. وعند الانتهاء أغلق النافذة بزر ✕ وأكمل من حيث كنت.</p>
                </div>`;
                return;
            }
            if (openReason !== 'nobalance' || isGuest) { box.innerHTML = ''; return; }
            const bal = pageData && pageData.wallet ? (pageData.wallet.balance || 0) : (parseInt(safeStorage('cached_wallet_balance')) || 0);
            box.innerHTML = `
                <div class="bg-rose-50 border border-rose-200 rounded-2xl p-3 mb-3 text-center">
                    <p class="text-xs font-black text-rose-700">رصيدك (${esc(bal)}) لا يكفي لإتمام طلبك${needPoints ? ` — يحتاج ${esc(needPoints)} نقطة` : ''}.</p>
                    <p class="text-[11px] font-bold text-rose-600 mt-1">اختر باقة وتُضاف نقاطها لرصيدك بعد تأكيد السداد، ثم أغلق هذه النافذة وأكمل طلبك من حيث توقفت.</p>
                </div>`;
        }

        function renderStatus() {
            if (pageData.guest) { document.getElementById('statusBox').innerHTML = ''; return; }
            const w = pageData.wallet || {};
            const isMale = pageData.gender === 'ذكر';
            document.getElementById('statusBox').innerHTML = `
                <div class="bg-white border border-indigo-100 rounded-2xl p-3 shadow-sm mb-3 flex items-center justify-around text-center">
                    <div><p class="text-[10px] text-slate-400 font-bold">رصيدك الحالي</p><p class="text-lg font-black text-indigo-600">${esc(w.balance || 0)} 💎</p></div>
                    ${isMale ? `<div class="border-r border-slate-100 pr-4"><p class="text-[10px] text-slate-400 font-bold">تواصلات خارج المنصة</p><p class="text-lg font-black text-emerald-600">${esc(w.freeExternal || 0)}</p>${(w.freeCover !== undefined && (w.freeExternal || 0) > 0) ? `<p class="text-[10px] text-slate-500 font-bold">${Number(w.freeCover) >= Number(w.freeExternal) ? 'كلها تشمل المسيار' : (Number(w.freeCover) > 0 ? 'منها ' + esc(w.freeCover) + ' تشمل المسيار' : 'للزواج المعلن (والمسيار بخصم)')}</p>` : ''}</div>` : ''}
                </div>`;
        }

        function renderPending() {
            const list = pageData.pending || [];
            const box = document.getElementById('pendingBox');
            if (!list.length) { box.innerHTML = ''; return; }
            box.innerHTML = list.map(p => `
                <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 mb-3 shadow-sm">
                    <p class="text-[11px] font-black text-amber-800 mb-1">⏳ لديك طلب بانتظار السداد: ${esc(p.packageName)} (${esc(p.price)} ريال) - ${esc(p.reqId)}</p>
                    <p class="text-[10px] text-amber-700 font-bold mb-2">حوّل المبلغ حسب الحسابات التي وصلتك على الواتساب، ثم أرسل الإيصال.</p>
                    <a href="${esc(receiptLink(p.packageName, p.price, p.reqId))}" target="_blank" rel="noopener" class="block text-center py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs">أرسل الإيصال للوسيط</a>
                </div>`).join('');
        }

        // 🟢 [2026-10-21] الباقة المجانية بالإحالة (القسم 34 في الخادم): الأعداد وأسماء الباقات من الشيت عبر pageData.referral
        function referralUrl() {
            const u = new URL('index.html', window.location.href);
            return u.origin + u.pathname + '?ref=' + encodeURIComponent(refIdParam);
        }
        // 🟢 [2026-11-01] عبارات جاهزة للمشاركة: يختار المشترك واحدة تناسب من يرسل إليه، ثم يرسلها أو ينسخها ومعها رابطه.
        // عبارة التعريف TRUST_LINE هي نفسها شارتا الصفحة الرئيسية (وثيقة العمل الحر / الموارد البشرية والتنمية الاجتماعية) — عدّلها هنا إن تغيّر الوصف الرسمي.
        const TRUST_LINE = 'وثيقة العمل الحر · الموارد البشرية والتنمية الاجتماعية';
        const SHARE_TEMPLATES = [
            { title: 'تعريف عام', text: 'السلام عليكم ورحمة الله 🌹\nأنصحكم بمنصة *أبو العنود للزواج*؛ وسيط زواج موثوق ({TRUST}).\nالتسجيل مجاني وبسرية تامة، وتُعرض بياناتك بعد اعتماد الوسيط فقط.\nسجّل من هنا 👇\n{LINK}' },

                const res = await postJson({ action: 'requestPackage', phone: phoneParam, refId: refIdParam, packageId: selectedPackageId });
                closeConfirm();
                if (!res || res.success !== true) { showToast((res && (res.error || res.message)) || 'تعذر تسجيل الطلب.'); return; }
                document.getElementById('doneText').innerText = res.message || 'تم تسجيل طلبك.';
                document.getElementById('doneReceiptLink').href = receiptLink(res.packageName, res.price, res.reqId);
                document.getElementById('doneModal').classList.remove('hidden');
                loadPage(true);
            } catch (e) {
                closeConfirm();
                showToast('تعذر الاتصال بالخادم، تحقق من الإنترنت وحاول مرة أخرى.');
            } finally { isSubmitting = false; btn.innerText = original; btn.disabled = false; }
        }

        async function loadPage(silent) {
            if (isModalMode) document.getElementById('pageTitleBox').classList.add('hidden');
            renderGuestBox();
            if (isGuest && !guestGender) {
                document.getElementById('statusBox').innerHTML = ''; document.getElementById('pendingBox').innerHTML = ''; document.getElementById('infoBox').innerHTML = ''; document.getElementById('referralBox').innerHTML = '';
                document.getElementById('packagesList').innerHTML = '<p class="text-center text-sm text-slate-500 font-bold py-8">اختر باقات الرجال أو باقات النساء لعرضها.</p>';
                return;
            }
            // [2026-11-14] ظهور فوري: آخر نسخة محفوظة على الجهاز (من زيارة سابقة أو من التحميل المسبق في القشرة) تُرسم في الحال،
            // ثم يُجلب الجديد من الخادم بصمت ويُستبدل المعروض إن اختلف (أسعار/باقات/رصيد). الاشتراك يُحجب لحظات حتى يصل التأكيد.
            let shownFromCache = false;
            if (!silent && !pageData) {
                const c = readPkgCache();
                if (c) {
                    pageData = c;
                    shownFromCache = true; unconfirmedPrices = true;
                    renderReason(); renderStatus(); renderPending(); renderReferral(); renderPackages(); renderInfo();
                    setRefreshNote('loading');
                    if (openReason === 'free' && !window.__freeScrolled && document.getElementById('referralBox').firstElementChild) { window.__freeScrolled = true; document.getElementById('referralBox').scrollIntoView({ block: 'start' }); }
                }
            }
            if (!silent && !shownFromCache) document.getElementById('packagesList').innerHTML = '<p class="text-center text-sm text-slate-400 font-bold py-10"><span class="inline-block spin">⏳</span> جاري تحميل الباقات...</p>';
            try {
                const before = pageData ? JSON.stringify(pageData) : '';
                const res = await postJson(isGuest
                    ? { action: 'getUserPackages', guestGender: guestGender }
                    : { action: 'getUserPackages', phone: phoneParam, refId: refIdParam });
                if (!res || res.success !== true) throw new Error((res && (res.error || res.message)) || 'تعذر التحميل');
                unconfirmedPrices = false; setRefreshNote('');
                writePkgCache(res);
                const changed = JSON.stringify(res) !== before;
                if (shownFromCache && !changed) return; // نفس ما عُرض: لا إعادة رسم ولا قفز
                const priceChanged = shownFromCache && JSON.stringify((res.packages || []).map(p => [p.id, p.name, p.price, p.points])) !== JSON.stringify(((JSON.parse(before) || {}).packages || []).map(p => [p.id, p.name, p.price, p.points]));
                pageData = res;
                renderReason(); renderStatus(); renderPending(); renderReferral(); renderPackages(); renderInfo();
                if (priceChanged) showToast('تم تحديث الباقات والأسعار ✅');
                if (openReason === 'free' && !window.__freeScrolled && document.getElementById('referralBox').firstElementChild) { window.__freeScrolled = true; document.getElementById('referralBox').scrollIntoView({ block: 'start' }); }
            } catch (e) {
                if (shownFromCache) { unconfirmedPrices = false; setRefreshNote('failed'); return; } // نُبقي النسخة المحفوظة ظاهرة بدل شاشة خطأ
                if (!silent) document.getElementById('packagesList').innerHTML = `<p class="text-center text-sm text-rose-600 font-bold py-10">${esc(e.message || 'تعذر تحميل الباقات')}<br><button type="button" onclick="loadPage()" class="mt-3 px-4 py-2 rounded-xl bg-slate-800 text-white text-xs font-black">إعادة المحاولة</button></p>`;
            }
        }

        loadPage();
    </script>
</body>
</html>
