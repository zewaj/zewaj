<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أبو العنود للزواج</title>
    <!-- 🟢 [2026-10-16] أُلغيت صفحة الرد السريع بقرار صاحب المشروع (نسختها في _lab_messaging/reply_prototype.html).
         هذا الملف باقٍ فقط لأن روابط واتساب أُرسلت به: يحوّل فوراً إلى صفحة المراسلات الكاملة على نفس المحادثة. -->
    <script>
        (function () {
            var p = new URLSearchParams(location.search), t = p.get('token'), r = p.get('r');
            var url = 'index.html';
            if (t && /^[A-Za-z0-9]{8,64}$/.test(t)) url += '?token=' + encodeURIComponent(t) + (r && /^[A-Za-z0-9_-]{3,40}$/.test(r) ? '&r=' + encodeURIComponent(r) : '');
            location.replace(url);
        })();
    </script>
</head>
<body></body>
</html>
