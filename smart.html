<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك  التطابق الذكي | منصة الزواج</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Tajawal', 'sans-serif'], },
                    colors: { primary: '#4f46e5', primaryHover: '#4338ca', }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8fafc; }
        .fade-in-up { animation: fadeInUp 0.4s ease-out forwards; opacity: 0; transform: translateY(15px); }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; opacity: 0; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { to { opacity: 1; } }
        .match-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .match-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); border-color: #c7d2fe; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .selection-mode-active .checkbox-indicator { display: flex; }
        .selection-mode-active .match-card { cursor: pointer; border-color: #e2e8f0; }
        .selection-mode-active .match-card:hover { border-color: #cbd5e1; transform: none; box-shadow: none; }
        .match-card.is-selected { border-color: #4f46e5; border-width: 2px; background-color: #f8fafc; }
        .match-card.is-selected .checkbox-indicator { background-color: #4f46e5; border-color: #4f46e5; color: white; }
        .checkbox-indicator {
            display: none; position: absolute; top: 12px; right: 12px; z-index: 30; width: 24px; height: 24px;
            border-radius: 6px; border: 2px solid #cbd5e1; background-color: white;
            align-items: center; justify-content: center; color: transparent; transition: all 0.2s;
        }
        
        #selectionFloatingBar {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); z-index: 100;
            transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #selectionFloatingBar.show { bottom: 24px; }
        
        .group-btn { transition: all 0.2s ease; }
        .group-btn.active { background-color: #4f46e5; color: white; border-color: #4f46e5; font-weight: bold; }
        .group-btn:not(.active) { background-color: white; color: #64748b; border-color: #e2e8f0; }
        .group-btn:not(.active):hover { background-color: #f8fafc; border-color: #cbd5e1; }

        body.in-iframe #mainPageHeader,
        body.in-iframe #smartSearchSection,
        body.in-iframe #smartSearchBanner {
            display: none !important;
        }
        body.in-iframe {
            background-color: transparent !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
        }
        body.in-iframe main {
            padding-top: 0 !important;
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-16 transition-colors duration-300">

    <header id="mainPageHeader" class="bg-white shadow-sm border-b border-slate-200 py-6 mb-8 transition-all">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">

                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>

                </div>
            </div>
            <div class="flex items-center gap-3">
                <div id="logoutBtnContainer" class="hidden">
                    <button onclick="logoutUser()" class="text-sm bg-rose-50 text-rose-600 hover:bg-rose-100 px-4 py-2 rounded-full font-medium border border-rose-100 transition-colors flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        تسجيل الخروج

                </div>
                <div class="text-sm bg-indigo-50 text-primary px-4 py-2 rounded-full font-medium border border-indigo-100 flex items-center gap-2">

                      <span class="relative inline-flex rounded-full h-3 w-3 bg-primary"></span>
                    </span>

        </div>

    <main class="max-w-6xl mx-auto px-4 transition-all duration-300">
        <section id="smartSearchSection" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-10 fade-in-up">

            </h2>
            <form id="searchForm" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">رقم الجوال</label>
                    <input type="text" id="phoneInput" placeholder="+966..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition" dir="ltr" text-right required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">الرقم المرجعي (رقم الملف)</label>

                </div>
                <div>

                </div>
                <div>

                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        تشغيل المطابقة
                    </button>
                </div>
            </form>
        </section>

                        <div class="w-10 h-10 bg-gray-200 rounded-lg"></div>

        function cleanAndFormatBio(bioText, nationality = "") {
            if (typeof bioText !== 'string' || bioText.trim() === '') return ''; 
            let cleaned = bioText.replace(/(?:🔹|-)?\s*(طلب رقم|رقم الملف|ملف رقم|ملف):?\s*#?\d+\s*/g, '');
            cleaned = cleaned.replace(/[\uFFFD\u2022\u00B7\u2756\u25AA\u25FE]/g, '🔹');
            cleaned = cleaned.replace(/(^|\n|")\s*\?\s*/g, '$1🔹 ');
            const flagEmoji = getFlagEmoji(nationality);
            cleaned = cleaned.replace(/🔹(?=\s*(الجنسية|جنسية))/g, flagEmoji + ' ');
            cleaned = cleaned.replace(/🔹(?=\s*(الإقامة|المدينة|مدينة))/g, '📍 ');
            cleaned = cleaned.replace(/🔹(?=\s*(قبيلي|غير قبيلي|الأصل|الأصول|القبيلة))/g, '💎 ');
            cleaned = cleaned.replace(/🔹(?=\s*(العمر|عمر))/g, '⏳ ');
            cleaned = cleaned.replace(/🔹(?=\s*(الطول))/g, '🪜 ');
            cleaned = cleaned.replace(/🔹(?=\s*(الوزن))/g, '🧱 ');
            cleaned = cleaned.replace(/🔹(?=\s*(الحالة|حالة))/g, '💍 ');
            cleaned = cleaned.replace(/🔹(?=\s*(المؤهل|تعليم|التعليم|تخصص))/g, '🎓 ');
            cleaned = cleaned.replace(/🔹(?=\s*(الوظيفة|العمل|موظف|جهة العمل))/g, '💼 ');
            cleaned = cleaned.replace(/🔹(?=\s*(نوع الزواج|الزواج|مطلوب))/g, '📋 ');
            cleaned = cleaned.replace(/🔹(?=\s*(الدخل|المستوى المالي))/g, '💵 ');
            cleaned = cleaned.replace(/🔹(?=\s*(قبول التعدد|التعدد|تقبل معدد))/g, '💞 ');
            cleaned = cleaned.replace(/🔹(?=\s*(معلومات|مواصفات|تفاصيل|المواصفات))/g, '💡 ');
            cleaned = cleaned.replace(/🔹(?=\s*(المواصفات المطلوبة|الشروط|شروط))/g, '💬 ');
            cleaned = cleaned.replace(/🔹(?=\s*(للجادين|تواصل|للتواصل))/g, '📌 ');
            cleaned = cleaned.replace(/🔹(?=\s*(#طلب|طلب|رقم الملف|ملف))/g, '✨ ');
            cleaned = cleaned.replace(/🔹/g, '🔸 '); 
            
            cleaned = cleaned.replace(/https?:\/\/wa\.me\/\d+/gi, '');
            cleaned = cleaned.replace(/(?:🔸|📌)?\s*للجادين[،,]\s*يمكنكم التواصل مع الإدارة عبر الرابط:?/gi, '');
            cleaned = cleaned.replace(/(?:🔸|📌)?\s*للتواصل والإدارة:?/gi, '');
            
            return cleaned.trim();
        }

        function getFirstNameForGreeting(fullName) {

            if (parts[0] === "عبد" && parts.length > 1) {

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toastNotification');

        function sendHeightToParent() {
            if (window.self !== window.top) {
                setTimeout(() => {
                    const height = document.documentElement.scrollHeight;
                    window.parent.postMessage({ type: 'resizeIframe', height: height + 50 }, '*');
                }, 300);
            }
        }

        async function fetchFromGAS(payload) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 25000);
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload),
                    redirect: "follow",
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                const text = await response.text();
                try {
                    return JSON.parse(text);
                } catch (e) {
                    throw new Error("Invalid response from server");
                }
            } catch (error) {
                clearTimeout(timeoutId);
                console.error("Network or Fetch Error:", error);
                throw error;
            }
        }

        async function fetchMatchesData(requestData) {
            const submitBtn = document.querySelector('#searchForm button[type="submit"]');
            const originalBtnHTML = submitBtn ? submitBtn.innerHTML : '';
            
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
                submitBtn.innerHTML = `<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> جاري البحث...`;
            }

            document.getElementById('resultsArea').classList.add('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            const loading = document.getElementById('loadingState');
            loading.classList.remove('hidden');
            loading.classList.add('flex');

            try {
                const result = await fetchFromGAS(requestData);
                
                const phone = localStorage.getItem('userPhone') || localStorage.getItem('temp_user_phone');
                if (phone) {
                    try {
                        const favRes = await fetchFromGAS({ action: 'getFavorites', phone: phone });
                        if (favRes.success && favRes.favorites) {
                            window.userFavorites = favRes.favorites;
                        }
                    } catch(e) { window.userFavorites = []; }
                }

                if (result.success && result.matches) {
                    window.cachedSmartResult = result;
                    window.cachedSmartRequest = requestData;
                    
                    processResultsDisplay(result, requestData, false);

                    if (submitBtn) {
                        submitBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> تم التحديث بنجاح!`;
                        submitBtn.classList.remove('bg-slate-900', 'hover:bg-primary', 'opacity-75', 'cursor-not-allowed');
                        submitBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
                        
                        setTimeout(() => {
                            submitBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> تحديث النتائج`;
                            submitBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                            submitBtn.classList.add('bg-primary', 'hover:bg-primaryHover');
                        }, 3000);
                    }
                } else {
                    showToast(result.message || "حدث خطأ غير متوقع.", 'error');
                    if (submitBtn) submitBtn.innerHTML = originalBtnHTML;
                }
            } catch (error) {
                console.error(error);
                let errorMsg = "حدث خطأ في الاتصال بالسيرفر. تأكد من جودة الاتصال.";
                if (error.name === 'AbortError') {
                    errorMsg = "تأخر استجابة الخادم بسبب ضغط البحث. يرجى المحاولة بعد قليل.";
                }
                showToast(errorMsg, 'error');
                if (submitBtn) submitBtn.innerHTML = originalBtnHTML;
            } finally {
                loading.classList.add('hidden');
                loading.classList.remove('flex');
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                }
                sendHeightToParent();
            }
        }

            window.realTotalSmartMatches = result.matches ? result.matches.length : 0;

            if (window.realTotalSmartMatches > MAX_SMART_MATCHES) {
                originalGlobalMatches = result.matches.slice(0, MAX_SMART_MATCHES);
            } else {
                originalGlobalMatches = result.matches || [];
            }
            
            globalMatches = []; 

            if (originalGlobalMatches.length > 50) {
                groupingContainer.classList.remove('hidden');
                groupingContainer.classList.add('flex');
                
                const highMatch = originalGlobalMatches.filter(m => (m.matchPercentage || 0) >= 90);
                const midMatch = originalGlobalMatches.filter(m => (m.matchPercentage || 0) >= 70 && (m.matchPercentage || 0) < 90);
                const lowMatch = originalGlobalMatches.filter(m => (m.matchPercentage || 0) < 70);

                let activeGroups = [];

                if (highMatch.length >= 6) {
                    activeGroups = ['high'];
                    globalMatches = highMatch;
                } else if (highMatch.length > 0 && highMatch.length < 6) {
                    activeGroups = ['high', 'mid'];
                    globalMatches = [...highMatch, ...midMatch];
                    if (globalMatches.length < 6 && lowMatch.length > 0) {
                        activeGroups.push('low');
                        globalMatches = [...globalMatches, ...lowMatch];
                    }
                } else if (highMatch.length === 0) {
                    if (midMatch.length >= 6) {
                        activeGroups = ['mid'];
                        globalMatches = midMatch;
                    } else if (midMatch.length > 0 && midMatch.length < 6) {
                        activeGroups = ['mid', 'low'];
                        globalMatches = [...midMatch, ...lowMatch];
                    } else {
                        activeGroups = ['low'];
                        globalMatches = lowMatch;
                    }
                }

                const baseClass = "flex-1 px-1 py-2 sm:py-2.5 rounded-xl text-[10px] sm:text-xs font-bold border shadow-sm transition-colors flex items-center justify-center whitespace-nowrap overflow-hidden";

                let buttonsHTML = '';
                if (highMatch.length > 0) {
                    buttonsHTML += `<button onclick="filterResultsByGroup('high', this)" class="group-btn ${activeGroups.includes('high') ? 'active' : ''} ${baseClass}">تطابق عالي (${highMatch.length})</button>`;
                } else {
                    buttonsHTML += `<button disabled class="${baseClass} bg-slate-50 text-slate-400 cursor-not-allowed opacity-70">تطابق عالي (0)</button>`;
                }

                if (midMatch.length > 0) {
                    buttonsHTML += `<button onclick="filterResultsByGroup('mid', this)" class="group-btn ${activeGroups.includes('mid') ? 'active' : ''} ${baseClass}">تطابق جيد (${midMatch.length})</button>`;
                } else {
                    buttonsHTML += `<button disabled class="${baseClass} bg-slate-50 text-slate-400 cursor-not-allowed opacity-70">تطابق جيد (0)</button>`;
                }

                if (lowMatch.length > 0) {
                    buttonsHTML += `<button onclick="filterResultsByGroup('low', this)" class="group-btn ${activeGroups.includes('low') ? 'active' : ''} ${baseClass}">تطابق مقبول (${lowMatch.length})</button>`;
                } else {
                    buttonsHTML += `<button disabled class="${baseClass} bg-slate-50 text-slate-400 cursor-not-allowed opacity-70">تطابق مقبول (0)</button>`;
                }
                groupingContainer.innerHTML = buttonsHTML;
            } else {
                globalMatches = originalGlobalMatches;
                groupingContainer.classList.add('hidden');
                groupingContainer.classList.remove('flex');
            }

            currentlyDisplayedCount = 0;
            document.getElementById('matchesContainer').innerHTML = '';
            window.currentCandidatesData = {}; 
            
            if (globalMatches.length > 0) {
                document.getElementById('emptyState').classList.add('hidden');

            document.querySelectorAll('.group-btn').forEach(btn => btn.classList.remove('active'));

            if (group === 'high') {
                globalMatches = originalGlobalMatches.filter(m => (m.matchPercentage || 0) >= 90);

            currentlyDisplayedCount = endIndex;
            if (isSelectionModeActive) selectAllVisibleCards();
            
            const loadMoreContainer = document.getElementById('loadMoreContainer');
            if (currentlyDisplayedCount < globalMatches.length) {
                const remaining = globalMatches.length - currentlyDisplayedCount;
                document.getElementById('loadMoreText').innerText = `عرض المزيد من النتائج (المتبقي: ${remaining})`;
                loadMoreContainer.classList.remove('hidden');
                loadMoreContainer.classList.add('flex');
            } else {
                loadMoreContainer.classList.add('hidden');
                loadMoreContainer.classList.remove('flex');
            }
            sendHeightToParent();
        }

        async function toggleFavorite(btn, refId) { 
            const userPhone = localStorage.getItem('verified_user_phone');
            const activeProfileRefId = localStorage.getItem('active_profile_refid');
            if (!userPhone) {
                if (window.self !== window.top) window.top.postMessage({ action: 'requireLogin' }, '*');
                return;
            }
            const isActive = btn.classList.contains('active');
            let cachedFavs = JSON.parse(localStorage.getItem('cached_favorites') || '[]');

            if (isActive) {
                btn.classList.remove('active', 'bg-amber-400', 'text-white', 'border-amber-400', 'border-yellow-400');
                btn.classList.add('bg-amber-50', 'text-amber-500', 'border-amber-100', 'border-amber-200');
                cachedFavs = cachedFavs.filter(id => id.toString() !== refId.toString());
            } else {
                btn.classList.add('active', 'bg-amber-400', 'text-white', 'border-amber-400');
                btn.classList.remove('bg-amber-50', 'text-amber-500', 'border-amber-100', 'border-amber-200');
                if (!cachedFavs.includes(refId.toString())) cachedFavs.push(refId.toString());
            }
            localStorage.setItem('cached_favorites', JSON.stringify(cachedFavs));

            try {
                const res = await fetchFromGAS({ action: 'toggleFavorite', phone: userPhone, requesterRefId: activeProfileRefId, refId: refId });
                if (res.success && window.self !== window.top) window.top.postMessage({ action: 'favoriteSuccess' }, '*');
            } catch (e) { console.error(e); }
        }

        function requestContact(refId) {
            if (window.self !== window.top) {
                window.top.postMessage({ type: 'requestContact', refId: refId }, '*');
                return; 
            }
        }

        function openProfileModal(data, title, subtitle) {
            if(!data) { showToast("بيانات الملف غير متوفرة.", "error"); return; }

            if (window.self !== window.top) {
                window.top.postMessage({
                    type: 'openProfileModal',
                    profileData: data,
                    title: title,
                    subtitle: subtitle
                }, '*');
                return; 
            }

            document.getElementById('upmTitle').innerText = title;
            document.getElementById('upmSubtitle').innerText = subtitle;
            
            let profileGender = data.gender || data.Gender || data['الجنس'];
            if (!profileGender) { profileGender = window.lastSearchedGender; }

            const getV = (key1, key2, key3) => data[key1] || data[key2] || data[key3] || '---';
            const nationality = getV('nationality', 'Nationality', 'الجنسية');
            const refId = data.refId || data.RefId || data.refID || 'غير محدد';
            const genderEmoji = profileGender === 'أنثى' ? '👰🏻' : '🧔🏻‍♂️';

            const detailedBioText = data.autoBio || data.bio || data.Bio || 'النبذة التفصيلية غير متوفرة';
            
            window.currentCleanBio = detailedBioText; 
            const encodedDetailedBio = encodeURIComponent(detailedBioText);

            const contentHTML = `
                <div class="bg-white rounded-2xl border border-slate-200 p-3 sm:p-5 shadow-sm h-full flex flex-col justify-center">
                    <div class="border-r-4 border-indigo-500 bg-slate-50 p-4 rounded-l-xl text-sm text-slate-700 leading-relaxed font-medium whitespace-pre-wrap text-right" dir="rtl">${detailedBioText}</div>
                </div>
            `;
            document.getElementById('upmBody').innerHTML = contentHTML;

            document.getElementById('upmFooter').innerHTML = `
                <div class="flex items-center gap-3 justify-center w-full">
                    <button onclick="requestContact('${refId}')" class="w-12 h-12 flex shrink-0 items-center justify-center bg-slate-50 text-slate-500 hover:bg-slate-100 font-bold rounded-xl transition-all border border-slate-200" title="طلب تواصل">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                    </button>
                    <button onclick="copyBioTextBtn(this)" data-bio="${encodedDetailedBio}" class="w-12 h-12 flex shrink-0 items-center justify-center bg-indigo-50 text-indigo-500 hover:bg-indigo-100 font-bold rounded-xl transition-all border border-indigo-200" title="نسخ البيانات">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    </button>
                    <!-- واتساب (أخضر غامق للنبذة التفصيلية الشاملة) -->
                    <button onclick="shareBioWA(this)" data-detailed="${encodedDetailedBio}" class="w-12 h-12 flex shrink-0 items-center justify-center bg-[#25D366] text-white hover:bg-[#1ebd57] font-bold rounded-xl transition-all shadow-sm border border-[#1ebd57]" title="إرسال النبذة التفصيلية عبر واتساب">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.275-.883-.63-1.48-1.408-1.653-1.705-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                    </button>
                </div>
            `;

            const modal = document.getElementById('unifiedProfileModal');
            if(modal) {
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.remove('opacity-0'), 10);
            }
        }
        
        function closeUnifiedProfileModal() {
            const modal = document.getElementById('unifiedProfileModal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function shareBioWA(btn) { 
            let text = btn.getAttribute('data-bio');
            if (!text) text = btn.getAttribute('data-detailed');
            window.open(`https://api.whatsapp.com/send?phone=${ADMIN_PHONE}&text=${text}`, '_blank'); 
        }
        
        function copyBioTextBtn(btn) {
            const textToCopy = decodeURIComponent(btn.getAttribute('data-bio'));
            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = textToCopy;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            try { document.execCommand('copy'); showToast('تم النسخ بنجاح'); } catch(e) {}
            document.body.removeChild(tempTextArea);
        }

        function openBulkShareModal(platform) {
            if (!globalMatches || globalMatches.length === 0) { showToast("لا توجد نتائج لمشاركتها.", "error"); return; }
            enterSelectionMode(platform);
        }

        function enterSelectionMode(platform) {
            pendingSharePlatform = platform;
            isSelectionModeActive = true;
            document.body.classList.add('selection-mode-active');
            selectAllVisibleCards();
            
            const floatingBar = document.getElementById('selectionFloatingBar');
            floatingBar.classList.remove('hidden');
            setTimeout(() => floatingBar.classList.add('show'), 10);
            
            const btnText = document.getElementById('confirmShareText');
            if (platform === 'whatsapp_detailed') btnText.innerText = 'إرسال النبذة التفصيلية';
            else if (platform === 'whatsapp_brief') btnText.innerText = 'إرسال بطاقات مختصرة';
            else if (platform === 'copy') btnText.innerText = 'نسخ الملفات المحددة';
        }

        function cancelSelectionMode() {
            isSelectionModeActive = false;
            pendingSharePlatform = '';
            selectedCandidates.clear();
            document.body.classList.remove('selection-mode-active');
            document.querySelectorAll('.match-card').forEach(card => card.classList.remove('is-selected'));
            
            const floatingBar = document.getElementById('selectionFloatingBar');
            floatingBar.classList.remove('show');
            setTimeout(() => floatingBar.classList.add('hidden'), 400);
        }

        function selectAllVisibleCards() {
            document.querySelectorAll('.match-card').forEach(card => {
                const refId = card.getAttribute('data-refid');
                if(refId) {
                    card.classList.add('is-selected');
                    selectedCandidates.add(refId);
                }
            });
            updateSelectionCounter();
        }

        function handleCardClick(cardElement, refId) {
            if (!isSelectionModeActive) return;
            if (cardElement.classList.contains('is-selected')) {
                cardElement.classList.remove('is-selected');
                selectedCandidates.delete(refId);
            } else {
                cardElement.classList.add('is-selected');
                selectedCandidates.add(refId);
            }
            updateSelectionCounter();
        }

        function updateSelectionCounter() {
            const countDisplay = document.getElementById('selectedCountDisplay');
            countDisplay.innerText = selectedCandidates.size;
            let currentLimit = 50;
            if (pendingSharePlatform === 'whatsapp_detailed') currentLimit = 20;
            else if (pendingSharePlatform === 'copy') currentLimit = 500;

            if (selectedCandidates.size > currentLimit) countDisplay.classList.replace('bg-indigo-500', 'bg-rose-500');
            else countDisplay.classList.replace('bg-rose-500', 'bg-indigo-500');
        }

        function closeLimitWarningModal() {
            const modal = document.getElementById('limitWarningModal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function confirmAndShareSelection() {
            if (selectedCandidates.size === 0) { showToast("يرجى تحديد ملف واحد على الأقل.", "error"); return; }
            
            let currentLimit = 50;
            let typeName = 'للبطاقات المختصرة';
            
            if (pendingSharePlatform === 'whatsapp_detailed') {
                currentLimit = 20; typeName = 'للنبذة التفصيلية الكاملة';
            } else if (pendingSharePlatform === 'copy') { currentLimit = 500; }

            if (selectedCandidates.size > currentLimit) {
                const excess = selectedCandidates.size - currentLimit;
                const msgEl = document.getElementById('limitWarningMessage');
                msgEl.innerHTML = `عذراً، الحد الأقصى المسموح به <strong>${typeName}</strong> هو (${currentLimit}) ملف فقط لتجنب تعليق الواتساب.<br><br>لقد قمت بتحديد <strong>(${selectedCandidates.size})</strong> ملف. يرجى إلغاء التحديد عن <strong>${excess}</strong> ملفات للمتابعة.`;
                const modal = document.getElementById('limitWarningModal');
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.remove('opacity-0'), 10);
                return; 
            }

            const formatType = pendingSharePlatform.includes('brief') ? 'brief' : 'detailed';
            const bulkText = generateBulkText(formatType, Array.from(selectedCandidates));
            const encodedText = encodeURIComponent(bulkText);

            if (pendingSharePlatform.includes('whatsapp')) {
                window.open(`https://api.whatsapp.com/send?phone=${ADMIN_PHONE}&text=${encodedText}`, '_blank');
            } else if (pendingSharePlatform === 'copy') {
                const tempTextArea = document.createElement("textarea");
                tempTextArea.value = bulkText;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                try { document.execCommand('copy'); showToast(`تم نسخ ${selectedCandidates.size} ملفات بنجاح!`); } catch (err) {}
                document.body.removeChild(tempTextArea);
            }
            cancelSelectionMode();
        }

        function generateBulkText(formatType, selectedIdsArray) {
            let fullText = "";
            const totalMatches = originalGlobalMatches.length; 
            const selectedCount = selectedIdsArray.length;
            
            if (window.myUserData) {
                const searcherName = window.myUserData.name || 'صاحب الطلب';
                const searcherAge = window.myUserData.age || '--';
                const searcherCity = window.myUserData.city || '--';
                const searcherRefId = window.myUserData.refId || window.myUserData.RefId || window.myUserData.refID || '--';
                const searcherNationality = window.myUserData.nationality || window.myUserData.Nationality || '--';
                const searcherMarital = window.myUserData.maritalStatus || window.myUserData.MaritalStatus || '--';
                
                fullText += `مرحباً بكم مع وسيط زواج أبو العمود،\nهذه الملفات المرشحة لطالب الزواج:\n\n`;
                fullText += `👤 ${searcherName} (${searcherAge} سنة)\n`;
                fullText += `🌍 ${searcherNationality} | 📍 مقيم في: ${searcherCity} | 💍 ${searcherMarital}\n`;
                fullText += `📄 رقم الطلب: #${searcherRefId}\n`;
                fullText += `=====================\n`;
                fullText += `(تم إرفاق ${selectedCount} ملفات من أصل ${totalMatches} نتيجة مطابقة)\n`;
                fullText += `=====================\n\n`;
            }

            const targetGender = window.lastSearchedGender || 'ذكر';
            const genderEmoji = targetGender === 'أنثى' ? '👰🏻' : '🧔🏻‍♂️';
            let counter = 1; 
            
            for (let i = 0; i < selectedIdsArray.length; i++) {
                const refId = selectedIdsArray[i];
                const candidate = window.currentCandidatesData[refId];
                if(!candidate) continue;

                fullText += `النتيجة رقم ${counter}:\n`;
                if (formatType === 'brief') {
                    fullText += (candidate.shortBio || "النبذة المختصرة غير متوفرة") + "\n=====================\n\n";
                } else {
                    fullText += (candidate.autoBio || candidate.bio || candidate.Bio || "النبذة التفصيلية غير متوفرة") + "\n=====================\n\n";
                }
                counter++;
            }
            fullText += MSG_OUTRO;
            return fullText;
        }

        function generateBriefText(c, targetGender, refId, genderEmoji) {
            const getV = (k1, k2) => c[k1] || c[k2] || 'غير محدد';
            const nat = getV('nationality', 'Nationality');
            const origin = getV('originType', 'OriginType');
            const tribe = getV('tribeName', 'TribeName');
            const originStr = (tribe && tribe !== 'غير محدد' && tribe !== '---') ? `${origin} - ${tribe}` : origin;
            const flagEmoji = getFlagEmoji(nat);
            const age = getV('age', 'Age');
            const city = getV('city', 'City');
            const marital = getV('maritalStatus', 'MaritalStatus');
            const edu = getV('education', 'Education');
            const job = getV('job', 'Job');
            const marriageType = getV('marriageType', 'MarriageType');
            const height = getV('height', 'Height');
            const weight = getV('weight', 'Weight');
            const skin = getV('skinColor', 'SkinColor');
            
            let text = `> ملف ${genderEmoji} رقم: #${refId}\n`;
            text += `${flagEmoji} الجنسية: ${nat} | 💎 الأصل: ${originStr}\n`;
            text += `📍 الإقامة: ${city} | ⏳ العمر: ${age} سنة\n`;
            text += `💍 الحالة: ${marital} | 🎨 البشرة: ${skin}\n`;
            
            if (targetGender === 'ذكر') {
                const income = getV('monthlyIncome', 'MonthlyIncome');
                text += `🎓 المؤهل: ${edu} | 💼 الوظيفة: ${job} | 💵 الدخل: ${income}\n`;
                text += `🪜 الطول: ${height} سم | 🧱 الوزن: ${weight} كجم\n`;
                text += `📋 الزواج المطلوب: ${marriageType}`;
            } else {
                const poly = c.acceptMarried || c.AcceptMarried || c.acceptsPolygamy || 'لا';
                text += `🪜 الطول: ${height} سم | 🧱 الوزن: ${weight} كجم\n`;
                text += `🎓 المؤهل: ${edu} | 💼 الوظيفة: ${job}\n`;
                text += `💞 قبول التعدد: ${poly} | 📋 الزواج المطلوب: ${marriageType}`;
            }
            return text;
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'updateAuthUI') {
                silentlyUpdateButtons();
            }
        });

        function silentlyUpdateButtons() {
            const cachedFavs = JSON.parse(localStorage.getItem('cached_favorites') || '[]');
            const cachedReqs = JSON.parse(localStorage.getItem('cached_requested_ids') || '[]');

            const cards = document.querySelectorAll('.match-card');
            cards.forEach(card => {
                const refId = card.getAttribute('data-refid');
                if (!refId) return;

                const favBtn = card.querySelector('.favorite-btn');
                if (favBtn) {
                    const isFav = cachedFavs.includes(refId.toString());
                    if (isFav) {
                        favBtn.classList.add('active', 'bg-amber-400', 'text-white', 'border-amber-400');
                        favBtn.classList.remove('bg-amber-50', 'text-amber-500', 'border-amber-100', 'border-amber-200');
                    } else {
                        favBtn.classList.remove('active', 'bg-amber-400', 'text-white', 'border-amber-400', 'border-yellow-400');
                        favBtn.classList.add('bg-amber-50', 'text-amber-500', 'border-amber-100', 'border-amber-200');
                    }
                }

                const contactBtn = card.querySelector('button[title="طلب تواصل"], button[title="تم الطلب مسبقاً"], button[title="تم إرسال الطلب"]');
                if (contactBtn) {
                    const isReq = cachedReqs.includes(refId.toString());
                    if (isReq) {
                        contactBtn.outerHTML = `
                        <button disabled class="w-10 h-10 flex shrink-0 items-center justify-center bg-gray-100 text-emerald-600 font-bold rounded-lg border border-emerald-200 cursor-not-allowed" title="تم الطلب مسبقاً">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </button>`;
                    } else if (contactBtn.hasAttribute('disabled')) {
                        contactBtn.outerHTML = `
                        <button onclick="event.stopPropagation(); requestContact('${refId}')" class="w-10 h-10 flex shrink-0 items-center justify-center bg-slate-50 text-slate-500 hover:bg-slate-100 font-bold rounded-xl transition-all border border-slate-200" title="طلب تواصل">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        </button>`;
                    }
                }
            });
        }
    </script>
</body>
</html>
